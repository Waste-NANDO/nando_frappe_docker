[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nando-erp-ops"
version = "0.1.0"
description = "CLI and library for NANDO ERPNext structure/data pipeline (local → cloud-dev → prod)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nando IT", email = "it@nando.ai" }]
dependencies = [
  "pyyaml>=6.0",
  "click>=8.1",
  "boto3>=1.34",
]

[project.optional-dependencies]
api = ["fastapi>=0.110"]
dev = ["pytest>=8.0"]

[project.scripts]
nando-erp = "nando_erp_ops.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nando_erp_ops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
